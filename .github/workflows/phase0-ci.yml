name: SEM Brain Phase 0 CI

on:
  push:
    branches:
      - codex/sem-brain-v1
  pull_request:
    branches:
      - master
    paths:
      - "web/**"
      - "supabase/**"
      - ".github/workflows/phase0-ci.yml"
      - "docs/SCHEMA-DRIFT-REPORT.md"
      - "docs/PHASE-0-ARCHITECTURE.md"

permissions:
  contents: read
  statuses: write

concurrency:
  group: phase0-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-and-unit:
    name: Static, unit, and Edge contracts
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        run: npm ci

      - name: Lint
        id: lint
        continue-on-error: true
        run: npm run lint 2>&1 | tee lint.log

      - name: Publish lint failure
        if: steps.lint.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          message="$(grep -m1 -E 'Error:|error|warning' lint.log | tr '\n' ' ' | cut -c1-130)"
          test -n "$message" || message="Lint failed; open the linked cloud run."
          gh api "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}"             -f state=failure             -f context="SEM Brain lint"             -f description="$message"             -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Stop after lint failure
        if: steps.lint.outcome == 'failure'
        run: exit 1

      - name: Type check
        id: typecheck
        continue-on-error: true
        run: npm run typecheck 2>&1 | tee typecheck.log

      - name: Publish type-check failure
        if: steps.typecheck.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          message="$(grep -m1 -E 'error TS|Type error|Error:' typecheck.log | tr '\n' ' ' | cut -c1-130)"
          test -n "$message" || message="Type check failed; open the linked cloud run."
          gh api "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}"             -f state=failure             -f context="SEM Brain typecheck"             -f description="$message"             -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Stop after type-check failure
        if: steps.typecheck.outcome == 'failure'
        run: exit 1

      - name: Unit tests
        run: npm run test:unit

      - name: Production build
        id: production_build
        continue-on-error: true
        run: npm run build 2>&1 | tee build.log

      - name: Publish build failure
        if: steps.production_build.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          message="$(grep -m1 -E 'Type error|Error:|Failed to compile' build.log | tr '\n' ' ' | cut -c1-130)"
          test -n "$message" || message="Production build failed; open the linked cloud run."
          gh api "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}"             -f state=failure             -f context="SEM Brain build"             -f description="$message"             -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Stop after build failure
        if: steps.production_build.outcome == 'failure'
        run: exit 1

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Edge Function contract tests
        working-directory: .
        run: deno test --allow-read=supabase/functions/sem-ai-command supabase/functions/sem-ai-command/contract.test.ts

  isolated-supabase-and-browser:
    name: Isolated RLS, integration, draft migration, and browser smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start isolated Supabase
        run: |
          supabase start
          eval "$(supabase status -o env)"
          echo "TEST_SUPABASE_URL=$API_URL" >> "$GITHUB_ENV"
          echo "TEST_SUPABASE_ANON_KEY=$ANON_KEY" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY" >> "$GITHUB_ENV"

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Founder versus Employee RLS tests
        run: supabase test db

      - name: Supabase integration smoke
        working-directory: web
        run: npm run test:integration

      - name: Install Chromium
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: Unauthenticated critical-page smoke
        working-directory: web
        run: npm run test:e2e

      - name: Validate review-only v1 migration in disposable database
        run: |
          cp supabase/drafts/202608270001_sem_brain_v1_execution.sql \
            supabase/migrations/202608270001_sem_brain_v1_execution.sql
          supabase db reset --local

      - name: Stop isolated Supabase
        if: always()
        run: supabase stop --no-backup
