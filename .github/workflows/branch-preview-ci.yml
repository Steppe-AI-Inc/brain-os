name: Branch Preview CI

on:
  push:
    branches:
      - codex/sem-brain-v1
    paths:
      - "web/**"
      - "supabase/migrations/**"
      - ".github/workflows/branch-preview-ci.yml"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: branch-preview-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-build:
    name: Next.js production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://pvphxgrtdfrudejjhzjk.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: preview-build-placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Build production application
        id: production-build
        shell: bash
        run: |
          set +e
          npm run build 2>&1 | tee ../preview-build.log
          build_status=${PIPESTATUS[0]}
          echo "status=${build_status}" >> "${GITHUB_OUTPUT}"
          exit 0
      - name: Report actionable build failure
        if: steps.production-build.outputs.status != '0'
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_SHA: ${{ github.sha }}
        run: |
          {
            echo "Automated branch build failed at commit \`${BUILD_SHA}\`."
            echo
            echo "\`\`\`text"
            tail -n 220 preview-build.log
            echo "\`\`\`"
          } > preview-build-issue.md
          gh issue create             --repo "${GITHUB_REPOSITORY}"             --title "[CI] Preview build failed ${BUILD_SHA:0:7}"             --body-file preview-build-issue.md
      - name: Fail job after reporting
        if: steps.production-build.outputs.status != '0'
        run: exit 1
