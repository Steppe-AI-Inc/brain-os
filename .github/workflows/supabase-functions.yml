name: Deploy Supabase Edge Functions

on:
  workflow_dispatch:

jobs:
  deploy-functions:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy Brain OS command function
        run: supabase functions deploy sem-ai-command --project-ref pvphxgrtdfrudejjhzjk
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      - name: Deploy artifact analyzer
        run: supabase functions deploy sem-artifact-analyze --project-ref pvphxgrtdfrudejjhzjk
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
