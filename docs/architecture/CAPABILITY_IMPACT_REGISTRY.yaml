# Capability-impact registry — shared concept -> everything that depends on it.
# Consulted before changing a shared primitive (FEATURE_COMPLETENESS_CONTRACT.md §6) and
# checked by qa/scenarios-runner/architecture_impact_registry_contract.mjs: every shared
# primitive listed in FEATURE_COMPLETENESS_CONTRACT.md §5 must have an entry here, and
# every `home` path must exist.
#
# Keep entries short: this is a map, not documentation. Surfaces are route or file
# names; regression families are qa/scenarios-runner file prefixes.

schema_version: 1

concepts:
  execution_result_envelope:
    description: one envelope per executed operation; the only admissible evidence for a current-turn mutation claim
    homes:
      - web/lib/contracts/execution.ts
      - supabase/functions/_shared/execution.ts
    entity_types: [company, person, project, task, goal, department, document, sales_lead, approval, chat_channel]
    surfaces:
      - supabase/functions/sem-ai-command/index.ts (every recordExecution site, work_orders.output.executionLedger)
      - web/app/(app)/chat
    ai_interactions: [archive, restore, create, update, rename, assign, reassign, delete, approve]
    regression_families: [architecture_mutation_envelope_contract, architecture_final_claim_contract, lifecycle_evidence_and_output_persistence_contract, structured_claim_verification, structured_claim_laundering_contract]

  mutation_receipt:
    description: founder-facing account of a turn's mutations rendered from envelopes; never silent on a mutation-intent turn
    homes:
      - supabase/functions/_shared/execution.ts
    entity_types: [company, person, project, task, goal, department, document, sales_lead, approval]
    surfaces:
      - supabase/functions/sem-ai-command/index.ts (summary assembly)
    ai_interactions: [all mutation intents]
    regression_families: [mutation_receipt_equals_ledger, architecture_final_claim_contract]

  collection_envelope:
    description: "{items, shown, total, truncated}" for every collection shown to the model or a page
    homes:
      - web/lib/contracts/collection.ts
      - supabase/functions/_shared/collection.ts
    entity_types: [all pack collections]
    surfaces:
      - supabase/functions/sem-ai-command/index.ts (context pack, counts)
      - web/app/(app)/dashboard
    ai_interactions: [counts, summaries, "how many", lists]
    regression_families: [architecture_collection_envelope_contract, dashboard_company_count_excludes_archived]

  grounding_precedence:
    description: receipt > fresh canonical > durable channel state > history > prose
    homes:
      - governance/OPERATING_TRUTH_MODEL.md
      - supabase/functions/sem-ai-command/index.ts (context pack tiers, pendingAction precedence)
    entity_types: [all]
    surfaces:
      - supabase/functions/sem-ai-command/index.ts (conversationHistory, chat_channel_state read)
    ai_interactions: [current-state questions, follow-ups after a mutation]
    regression_families: [grounding_precedence_canonical_over_history, run11_defect_closure_contract, current_turn_and_continuity_contract]

  company_lifecycle:
    description: archive/restore via the canonical RPCs with server-side target resolution across statuses
    homes:
      - supabase/migrations/202608280013_frictionless_company_delete.sql
      - web/lib/contracts/lifecycle.ts
      - supabase/functions/_shared/lifecycle.ts
    entity_types: [company]
    surfaces:
      - web/app/(app)/companies
      - web/app/(app)/companies/archived
      - web/app/(app)/dashboard (counts)
      - supabase/functions/sem-ai-command/index.ts (archive/restoreCompanyIds executor)
    selectors: [company pickers on people, projects, tasks, goals, departments, documents, leads]
    ai_interactions: [archive company, restore company, is X archived]
    regression_families: [company_lifecycle_matrix, sem_ai_command_company_restore_truth, architecture_lifecycle_rpc_only_contract, lifecycle_evidence_and_output_persistence_contract, company_archive_ownership, tenant_authorization_lifecycle]
    notes: task and goal lifecycle ids resolve server-side too (ledger #131); deleteTaskIds / pendingDeleteTaskIds stay gated by contextTaskIds on purpose (a permanent deletion targets a row the caller was shown); creation against an archived parent stays gated

  archived_parent_policy:
    description: one policy for descendants of an archived / inactive / deleted parent
    homes:
      - web/lib/policy/archived-parent.ts
      - web/lib/data/company-ref.ts
      - supabase/functions/_shared/parent-policy.ts
    entity_types: [person, project, department, goal, task, document, sales_lead]
    surfaces:
      - web/app/(app)/people
      - web/app/(app)/projects
      - web/app/(app)/departments
      - web/app/(app)/goals
      - web/app/(app)/tasks
      - web/app/(app)/documents
      - web/app/(app)/sales
    selectors: [manager picker, assignee pickers, company pickers]
    ai_interactions: [assign, invite, onboard, create under company]
    regression_families: [architecture_archived_parent_policy_contract, people_mark_archived_parent_company, departments_hide_or_mark_archived_parent, company_ref_no_bare_name_join]

  manager_assignment:
    description: replacement semantics, no self-management, visible current manager, reasoned empty picker
    homes:
      - web/app/(app)/people/people-table.tsx
      - supabase/functions/sem-ai-command/index.ts (personAssignments executor)
    entity_types: [person]
    surfaces:
      - web/app/(app)/people
    ai_interactions: [set manager, reassign manager]
    regression_families: [mutation_receipt_equals_ledger, manager_set_ui_canonical_write, architecture_archived_parent_policy_contract]

  org_scope:
    description: organization scope resolved once through resolveOrgScope()
    homes:
      - web/lib/data/org-scope.ts
      - web/lib/data/organizations.ts
    entity_types: [all org-scoped]
    surfaces:
      - every web/app/(app)/* page that lists org-scoped rows
    regression_families: [architecture_org_scope_helper_contract, org_selector_scoping_coverage]

  pending_action:
    description: durable structured channel state for disambiguation / confirmation; never grounds a completion claim
    homes:
      - supabase/migrations/202609020001_chat_channel_state_durable_conversation.sql
      - supabase/functions/sem-ai-command/index.ts
    entity_types: [chat_channel]
    surfaces:
      - web/app/(app)/chat
    ai_interactions: [option 2, yes, confirm, cancel]
    regression_families: [grounding_precedence_canonical_over_history, issue5_confirmation_action_type_binding, run8, run10, run11, run12, run13, run14, run15, run16, run19, run28]

  # ---- Factory control plane V1 (Auto-Enrollment; docs/architecture/features/factory-node-management-auto-enrollment.md). These live
  # on the dedicated Factory project, never in Brain OS production (S-9); the web page reaches them only through the Factory Admin API.
  # developer_suites are the implementer's qa/factory/v1 suites (developer verification, never independent acceptance).
  factory_node_identity:
    description: computer -> agent principal -> one active Ed25519 credential -> short session; every node call re-derives identity, tenant and envelope from the credential inside its transaction (S-2, S-3, S-4)
    homes:
      - supabase/control-plane/v1/020_identity.sql
      - supabase/control-plane/v1/100_node_common.sql
      - supabase/control-plane/v1/140_sessions.sql
      - supabase/control-plane/edge/supabase/functions/_shared/node_api.ts
      - scripts/factory-runner/enrolled/keys.mjs
    entity_types: [factory_computer, factory_agent_principal, factory_node_credential, factory_node_session]
    surfaces:
      - supabase/control-plane/edge/supabase/functions/factory-node-api/index.ts
      - web/app/(app)/software-factory/computers
    ai_interactions: [none - no AI path reaches the Factory plane]
    developer_suites:
      - qa/factory/v1/revocation_interleaving.mjs
      - qa/factory/v1/admin_acceptance.mjs
    regression_families: [factory_v1_static_contract]

  factory_pairing:
    description: one-time pairing code = public locator + CSPRNG secret, verified as HMAC-SHA256(pepper) with a constant-time compare, TTL <= 15 min, attempt / IP / tenant limits, atomic consume; never a credential (S-6)
    homes:
      - supabase/control-plane/v1/030_enrollment.sql
      - supabase/control-plane/v1/150_enrollment.sql
      - supabase/control-plane/edge/supabase/functions/_shared/pairing.ts
      - supabase/control-plane/edge/supabase/functions/_shared/enroll.ts
    entity_types: [factory_pairing_code, factory_enrollment]
    surfaces:
      - scripts/factory-runner/enrolled/setup.mjs
      - web/app/(app)/software-factory/computers
    ai_interactions: [none]
    developer_suites:
      - qa/factory/v1/enrollment_acceptance.mjs
    regression_families: [factory_v1_static_contract]

  factory_authorization_and_eligibility:
    description: the admin-set envelope (what a computer MAY do) and the 12 hard gates in the founder's order; ranking only among eligible nodes, bounded deferral, numeric priority; hostname and resources never authorize (S-4, WO-5)
    homes:
      - supabase/control-plane/v1/110_eligibility.sql
      - supabase/control-plane/v1/200_admin_common.sql
    entity_types: [factory_authorization_envelope, factory_work_order]
    surfaces:
      - supabase/control-plane/v1/120_node_lifecycle.sql (claim, verification claim)
      - web/app/(app)/software-factory/computers (waiting verifications: each node's first failing gate)
    ai_interactions: [none]
    developer_suites:
      - qa/factory/v1/eligibility_acceptance.mjs
    regression_families: [factory_v1_static_contract]

  factory_admin_authority:
    description: every admin action re-derives the caller's live Brain OS role from the caller's own token AND requires a factory.tenant_admins row (tier founder for founder-only actions); UI hiding is never the control (S-8)
    homes:
      - supabase/control-plane/v1/010_tenancy.sql
      - supabase/control-plane/v1/200_admin_common.sql
      - supabase/control-plane/edge/supabase/functions/_shared/admin_api.ts
      - web/lib/factory/admin-client.ts
    entity_types: [factory_tenant_admin]
    surfaces:
      - supabase/control-plane/edge/supabase/functions/factory-admin-api/index.ts
      - web/lib/data/factory-computers.ts
    ai_interactions: [none]
    developer_suites:
      - qa/factory/v1/admin_acceptance.mjs
      - qa/factory/v1/web_computers_acceptance.mjs
    regression_families: [factory_v1_static_contract]

  factory_verification_independence:
    description: the authoring set (every leased run + checkpoint writers); certification requires a run and identity outside it, current verifier authority and exact provenance - enforced in the front door whatever a policy says; policies change only stricter (S-13, S-14)
    homes:
      - supabase/control-plane/v1/050_verification.sql
      - supabase/control-plane/v1/130_verification.sql
    entity_types: [factory_certification, factory_verification_policy]
    surfaces:
      - web/app/(app)/software-factory/computers (policy view, waiting verifications)
    ai_interactions: [none]
    developer_suites:
      - qa/factory/v1/independence_acceptance.mjs
    regression_families: [factory_v1_static_contract]

  factory_release_trust:
    description: the trust set and mode fixed in the artifact per channel at build time; a release runs only after its manifest signature, key id and PE Authenticode image hash verify against it, before execution; the API delivers revocations only; a revoked release stands by until an admin adopts a certified one (S-5, WO-6)
    homes:
      - scripts/factory-runner/enrolled/release.mjs
      - scripts/factory-runner/enrolled/pe-image.mjs
      - scripts/factory-runner/enrolled/trust/production.json
      - scripts/factory-build/build-sea.mjs
      - supabase/control-plane/v1/060_releases.sql
    entity_types: [factory_release, factory_release_revocation]
    surfaces:
      - scripts/factory-runner/enrolled/supervisor.mjs
      - scripts/factory-runner/enrolled/upgrade.mjs
      - web/lib/factory/pe-image.ts
    ai_interactions: [none]
    developer_suites:
      - qa/factory/v1/release_acceptance.mjs
      - qa/factory/sea_package_regression.mjs
    regression_families: [factory_v1_static_contract]

  factory_legacy_fence:
    description: the frozen 69df2f52 fleet keeps its engine on the same tables while factory_runner can write no authority record and no new-model / enrolled row; the reserved capability factory-enrolled-v1 separates the fleets (S-10)
    homes:
      - supabase/control-plane/v1/080_guards.sql
      - supabase/control-plane/v1/000_preconditions_roles.sql
    entity_types: [factory_work_order, factory_agent_run, factory_surface_lock]
    surfaces:
      - scripts/factory-runner/claim.mjs (frozen legacy path, unchanged)
    ai_interactions: [none]
    developer_suites:
      - qa/factory/v1/compat_regressions.mjs
      - qa/factory/v1/schema_acceptance.mjs
    regression_families: [factory_v1_static_contract]

  factory_edge_route_surface:
    description: exactly the S-7 routes under each function's platform path prefix; every route or op is one SQL front door; every whole-request refusal classified (CLAUDE.md §6)
    homes:
      - supabase/control-plane/edge/supabase/functions/_shared/route.ts
      - supabase/control-plane/edge/supabase/config.toml
    entity_types: [none]
    surfaces:
      - supabase/control-plane/edge/supabase/functions/factory-node-api/index.ts
      - supabase/control-plane/edge/supabase/functions/factory-admin-api/index.ts
    ai_interactions: [none]
    developer_suites:
      - qa/factory/v1/admin_acceptance.mjs
    regression_families: [factory_v1_static_contract]

# Known lifecycle-completeness gaps (not done; registered so they are not forgotten):
gaps:
  - entity_types: [project, department, document, sales_lead, approval]
    gap: hard DELETE with no archive/restore lifecycle; must adopt the frictionless-secure-crud shape
    owner: next lifecycle-completeness package
