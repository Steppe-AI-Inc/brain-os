# Capability-impact registry — shared concept -> everything that depends on it.
# Consulted before changing a shared primitive (FEATURE_COMPLETENESS_CONTRACT.md §6) and
# checked by qa/scenarios-runner/architecture_impact_registry_contract.mjs: every shared
# primitive listed in FEATURE_COMPLETENESS_CONTRACT.md §5 must have an entry here, and
# every `home` path must exist.
#
# Keep entries short: this is a map, not documentation. Surfaces are route or file
# names; regression families are qa/scenarios-runner file prefixes.

schema_version: 1

concepts:
  execution_result_envelope:
    description: one envelope per executed operation; the only admissible evidence for a current-turn mutation claim
    homes:
      - web/lib/contracts/execution.ts
      - supabase/functions/_shared/execution.ts
    entity_types: [company, person, project, task, goal, department, document, sales_lead, approval, chat_channel]
    surfaces:
      - supabase/functions/sem-ai-command/index.ts (every recordExecution site, work_orders.output.executionLedger)
      - web/app/(app)/chat
    ai_interactions: [archive, restore, create, update, rename, assign, reassign, delete, approve]
    regression_families: [architecture_mutation_envelope_contract, architecture_final_claim_contract, mutation_claim_requires_verified_execution, mutation_receipt_equals_ledger, lifecycle_evidence_and_output_persistence_contract]

  mutation_receipt:
    description: founder-facing account of a turn's mutations rendered from envelopes; never silent on a mutation-intent turn
    homes:
      - supabase/functions/_shared/execution.ts
    entity_types: [company, person, project, task, goal, department, document, sales_lead, approval]
    surfaces:
      - supabase/functions/sem-ai-command/index.ts (summary assembly)
    ai_interactions: [all mutation intents]
    regression_families: [mutation_receipt_equals_ledger, mutation_claim_requires_verified_execution]

  collection_envelope:
    description: "{items, shown, total, truncated}" for every collection shown to the model or a page
    homes:
      - web/lib/contracts/collection.ts
      - supabase/functions/_shared/collection.ts
    entity_types: [all pack collections]
    surfaces:
      - supabase/functions/sem-ai-command/index.ts (context pack, counts)
      - web/app/(app)/dashboard
    ai_interactions: [counts, summaries, "how many", lists]
    regression_families: [architecture_collection_envelope_contract, collection_envelope_every_pack_collection]

  grounding_precedence:
    description: receipt > fresh canonical > durable channel state > history > prose
    homes:
      - governance/OPERATING_TRUTH_MODEL.md
      - supabase/functions/sem-ai-command/index.ts (context pack tiers, pendingAction precedence)
    entity_types: [all]
    surfaces:
      - supabase/functions/sem-ai-command/index.ts (conversationHistory, chat_channel_state read)
    ai_interactions: [current-state questions, follow-ups after a mutation]
    regression_families: [grounding_precedence_canonical_over_history, pending_action_precedence_contract]

  company_lifecycle:
    description: archive/restore via the canonical RPCs with server-side target resolution across statuses
    homes:
      - supabase/migrations/202608280013_frictionless_company_delete.sql
      - web/lib/contracts/lifecycle.ts
      - supabase/functions/_shared/lifecycle.ts
    entity_types: [company]
    surfaces:
      - web/app/(app)/companies
      - web/app/(app)/companies/archived
      - web/app/(app)/dashboard (counts)
      - supabase/functions/sem-ai-command/index.ts (archive/restoreCompanyIds executor)
    selectors: [company pickers on people, projects, tasks, goals, departments, documents, leads]
    ai_interactions: [archive company, restore company, is X archived]
    regression_families: [company_lifecycle_matrix, company_lifecycle_truth, bug014, architecture_lifecycle_rpc_only_contract]

  archived_parent_policy:
    description: one policy for descendants of an archived / inactive / deleted parent
    homes:
      - web/lib/policy/archived-parent.ts
      - web/lib/data/company-ref.ts
      - supabase/functions/_shared/parent-policy.ts
    entity_types: [person, project, department, goal, task, document, sales_lead]
    surfaces:
      - web/app/(app)/people
      - web/app/(app)/projects
      - web/app/(app)/departments
      - web/app/(app)/goals
      - web/app/(app)/tasks
      - web/app/(app)/documents
      - web/app/(app)/sales
    selectors: [manager picker, assignee pickers, company pickers]
    ai_interactions: [assign, invite, onboard, create under company]
    regression_families: [architecture_archived_parent_policy_contract, archived_parent_policy, people_mark_archived_parent_company]

  manager_assignment:
    description: replacement semantics, no self-management, visible current manager, reasoned empty picker
    homes:
      - web/app/(app)/people/people-table.tsx
      - supabase/functions/sem-ai-command/index.ts (personAssignments executor)
    entity_types: [person]
    surfaces:
      - web/app/(app)/people
    ai_interactions: [set manager, reassign manager]
    regression_families: [mutation_receipt_equals_ledger, bug011, bug012]

  org_scope:
    description: organization scope resolved once through resolveOrgScope()
    homes:
      - web/lib/data/org-scope.ts
      - web/lib/data/organizations.ts
    entity_types: [all org-scoped]
    surfaces:
      - every web/app/(app)/* page that lists org-scoped rows
    regression_families: [architecture_org_scope_helper_contract]

  pending_action:
    description: durable structured channel state for disambiguation / confirmation; never grounds a completion claim
    homes:
      - supabase/migrations/202609020001_chat_channel_state.sql
      - supabase/functions/sem-ai-command/index.ts
    entity_types: [chat_channel]
    surfaces:
      - web/app/(app)/chat
    ai_interactions: [option 2, yes, confirm, cancel]
    regression_families: [pending_action_precedence_contract, run8, run10, run11, run12, run13, run14, run15, run16, run19, run28]

# Known lifecycle-completeness gaps (not done; registered so they are not forgotten):
gaps:
  - entity_types: [project, department, document, sales_lead, approval]
    gap: hard DELETE with no archive/restore lifecycle; must adopt the frictionless-secure-crud shape
    owner: next lifecycle-completeness package
